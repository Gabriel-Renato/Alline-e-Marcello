<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="confirmacao.css">
    <title>Confirme presença · Alline e Marcello</title>
</head>

<body>

    <main class="background"></main>
    <nav class="navbar">
        <div class="navbar-logo"><img src="img/LOGO AM.png" alt="Logo"></div>
        <button class="menu-button" id="menuButton" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>


    <div class="menu-overlay" id="menuOverlay">
        <nav class="menu-sections">
            <a href="./index.html">Início</a>
            <a href="./confirmacao.html">Confirme Presença</a>
            <a href="/instrucoes/index.html">Dicas e instruções</a>
            <a href="./presentes.html">Presentes</a>
        </nav>
    </div>


    <main class="confirmacao">
        <h1 class="confirmacao-titulo">
            Digite seu nome<span class="pontos">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </h1>

        <p class="confirmacao-texto">
            Digite seu nome completo no campo abaixo e selecione
            seu nome na lista para confirmar sua presença.
        </p>

        <div class="campo-nome">
            <input type="text" id="nomeConvidado" placeholder="Escreva seu nome..." autocomplete="off">
        </div>
    </main>

    <script>
        const API_BASE = 'api/index.php?r=';

        const menuButton = document.getElementById("menuButton");
        const menuOverlay = document.getElementById("menuOverlay");

        menuButton.addEventListener("click", () => {
            menuButton.classList.toggle("active");
            menuOverlay.classList.toggle("active");
        });

        const campoNome = document.getElementById("nomeConvidado");
        const campoNomeContainer = document.querySelector(".campo-nome");
        let selectedGuest = null;
        let searchAbort = null;

        if (campoNome && campoNomeContainer) {
            const listaSugestoes = document.createElement("div");
            listaSugestoes.className = "lista-sugestoes";
            listaSugestoes.id = "listaSugestoes";
            campoNomeContainer.insertAdjacentElement("afterend", listaSugestoes);

            const areaConfirmacao = document.createElement("div");
            areaConfirmacao.className = "area-resposta";
            areaConfirmacao.id = "areaResposta";
            areaConfirmacao.hidden = true;
            listaSugestoes.insertAdjacentElement("afterend", areaConfirmacao);

            const feedback = document.createElement("p");
            feedback.className = "confirmacao-texto";
            feedback.id = "feedbackBusca";
            feedback.style.display = "none";
            areaConfirmacao.insertAdjacentElement("beforebegin", feedback);

            campoNome.addEventListener("input", () => {
                const pesquisa = campoNome.value.trim();
                listaSugestoes.innerHTML = "";
                listaSugestoes.style.display = "none";
                areaConfirmacao.hidden = true;
                selectedGuest = null;
                feedback.style.display = "none";

                if (!pesquisa) return;

                if (searchAbort) searchAbort.abort();
                searchAbort = new AbortController();

                fetch(`${API_BASE}guests/search&term=${encodeURIComponent(pesquisa)}`, {
                    signal: searchAbort.signal
                })
                    .then(r => r.json())
                    .then(resultados => {
                        if (!Array.isArray(resultados) || resultados.length === 0) {
                            feedback.textContent = "Seu nome não está na lista. Fale com os noivos.";
                            feedback.style.display = "block";
                            return;
                        }

                        listaSugestoes.style.display = "block";
                        resultados.forEach(guest => {
                            const opcao = document.createElement("button");
                            opcao.type = "button";
                            opcao.className = "opcao-convidado";
                            opcao.textContent = guest.name + (guest.already_confirmed ? " (já respondeu)" : "");
                            opcao.addEventListener("click", () => selecionarConvidado(guest));
                            listaSugestoes.appendChild(opcao);
                        });
                    })
                    .catch(err => {
                        if (err.name === "AbortError") return;
                        feedback.textContent = "Erro ao buscar nomes. Tente novamente.";
                        feedback.style.display = "block";
                    });
            });

            function selecionarConvidado(guest) {
                selectedGuest = guest;
                campoNome.value = guest.name;

                document.querySelector(".confirmacao-titulo").style.display = "none";
                document.querySelector(".confirmacao-texto").style.display = "none";
                campoNomeContainer.style.display = "none";
                feedback.style.display = "none";

                listaSugestoes.style.display = "none";
                listaSugestoes.innerHTML = "";

                areaConfirmacao.hidden = false;
                areaConfirmacao.innerHTML = "";

                const titulo = document.createElement("h2");
                titulo.textContent = `Olá, ${guest.name}!`;

                const mensagem = document.createElement("p");
                mensagem.textContent = "Você confirma sua presença no casamento?";

                const botoes = document.createElement("div");
                botoes.className = "botoes-resposta";

                const botaoSim = document.createElement("button");
                botaoSim.type = "button";
                botaoSim.textContent = "Sim, estarei presente";

                const botaoNao = document.createElement("button");
                botaoNao.type = "button";
                botaoNao.textContent = "Não poderei comparecer";

                botaoSim.addEventListener("click", () => enviarConfirmacao("confirmed"));
                botaoNao.addEventListener("click", () => enviarConfirmacao("declined"));

                botoes.append(botaoSim, botaoNao);
                areaConfirmacao.append(titulo, mensagem, botoes);
            }

            async function enviarConfirmacao(status) {
                if (!selectedGuest) return;
                try {
                    const res = await fetch(`${API_BASE}confirmations`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ guest_name: selectedGuest.name, status })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        alert(data.message || "Não foi possível confirmar agora.");
                        return;
                    }
                    if (status === "confirmed") {
                        mostrarMensagem(
                            `Que alegria, ${selectedGuest.name}!`,
                            "Sua presença será muito especial para nós. Estamos esperando você!"
                        );
                    } else {
                        mostrarMensagem(
                            `Obrigado por nos avisar, ${selectedGuest.name}.`,
                            "Sentiremos sua falta e agradecemos por nos informar."
                        );
                    }
                } catch {
                    alert("Erro de conexão com o servidor.");
                }
            }

            function mostrarMensagem(tituloTexto, mensagemTexto) {
                areaConfirmacao.innerHTML = "";

                const titulo = document.createElement("h2");
                titulo.textContent = tituloTexto;

                const mensagem = document.createElement("p");
                mensagem.textContent = mensagemTexto;

                const botoes = document.createElement("div");
                botoes.className = "botoes-finais";

                const botaoPresente = document.createElement("a");
                botaoPresente.href = "presentes.html";
                botaoPresente.textContent = "Escolher presente";
                botaoPresente.className = "botao-inicio";

                const botaoInicio = document.createElement("a");
                botaoInicio.href = "index.html";
                botaoInicio.textContent = "Voltar para o início";
                botaoInicio.className = "botao-inicio";

                botoes.append(botaoPresente, botaoInicio);
                areaConfirmacao.append(titulo, mensagem, botoes);
            }
        }
    </script>
</body>
<footer class="rodape">
    <p>Acima de tudo, porém, revistam-se do amor, que é o elo perfeito. <br> <strong>Colossenses 3:14</strong></p>
</footer>

</html>
